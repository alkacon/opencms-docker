user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cache '$remote_addr - $host "$request" $status $body_bytes_sent '
                     'cache=$upstream_cache_status auth=$has_authorization '
                     'session=$has_session_cookie public=$response_is_public '
                     'upstream=$upstream_addr '
                     'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log cache;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Cache bodies are stored on disk. The shared-memory zone contains keys and metadata only.
    proxy_cache_path /var/cache/nginx/media
        levels=1:2
        keys_zone=opencms_media:20m
        max_size=10g
        inactive=7d
        use_temp_path=off;

    # Explicit authorization and OpenCms authentication/session cookies bypass the shared cache.
    # Unrelated cookies, such as consent or analytics cookies, do not disable public media caching.
    map $http_authorization $has_authorization {
        default 1;
        ""      0;
    }

    map $http_cookie $has_session_cookie {
        default                                             0;
        "~*(^|;[[:space:]]*)JSESSIONID(_[^=;]*)?="          1;
        "~*(^|;[[:space:]]*)ocmsLoginToken="                1;
    }

    # OpenCms remains responsible for deciding whether a response is public. NGINX only stores
    # responses which explicitly contain either "public" or "s-maxage" in Cache-Control.
    map $upstream_http_cache_control $response_is_public {
        default                         0;
        ~*(^|,)[[:space:]]*public       1;
        ~*(^|,)[[:space:]]*s-maxage=    1;
    }

    # Cache only successful complete and partial responses, even if an error response accidentally
    # carries public cache directives.
    map $upstream_status $response_status_is_cacheable {
        default 0;
        200     1;
        206     1;
    }

    map "$response_is_public:$response_status_is_cacheable" $response_must_not_be_cached {
        default 1;
        "1:1"   0;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    upstream opencms_backend {
        zone opencms_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        server opencms:8080 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # The NGINX default is only 1 MiB. Keep this aligned with the maximum media upload
        # size accepted by OpenCms in a production installation.
        client_max_body_size 2g;

        # In shared-cache mode every /export response is generated by OpenCms. No local
        # static-export copy is consulted, so old files can not hide origin or policy changes.
        location /export/ {
            proxy_pass http://opencms_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Cache the identity representation. Upstream compression combined with byte-range
            # slicing can otherwise produce a compressed body with the uncompressed length.
            # NGINX still compresses suitable responses for clients through the gzip settings.
            proxy_set_header Accept-Encoding "";

            slice 1m;
            proxy_set_header Range $slice_range;

            proxy_cache opencms_media;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme://$host$request_uri$slice_range";
            proxy_cache_valid 200 206 10m;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_force_ranges on;

            proxy_cache_bypass $has_authorization $has_session_cookie;
            proxy_no_cache $has_authorization $has_session_cookie $response_must_not_be_cached;

            add_header X-OpenCms-Cache $upstream_cache_status always;
        }

        # Workplace, login, offline and all other application requests are never cached here.
        location / {
            proxy_pass http://opencms_backend;
            proxy_http_version 1.1;
            # Forward large media uploads while they are received instead of first buffering
            # the complete request body in an NGINX temporary file.
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            add_header X-OpenCms-Cache BYPASS always;
        }
    }
}
